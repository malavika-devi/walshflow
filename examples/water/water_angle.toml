[system]
name = "H2O"
charge = 0
spin = 0  # 2S = multiplicity - 1; singlet => 0

[method]
theory = "dft"
xc = "pbe"
basis = "def2-svp"
density_fit = true
grid_level = 3
conv_tol = 1e-10
max_cycle = 100
memory_mb = 2000
threads = 2
pyscf_verbose = 3

[scan]
type = "angle"
reference = "water.xyz"
atoms = [2, 1, 3]       # H-O-H, 1-based
move_atoms = [3]
minimum = 90.0
maximum = 180.0
points = 19

[tracking]
orbitals_each_side = 1
candidate_margin = 2
max_energy_step_ev = 3.0
ambiguous_margin = 0.10

[output]
directory = "run_water_dft"
coordinate_label = "H-O-H angle (degrees)"
title = "H2O Walsh diagram (PBE/def2-SVP)"
energy_reference = "minimum"
