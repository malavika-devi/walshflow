[system]
name = "H2O"
charge = 0
spin = 0

[method]
theory = "mp2"
basis = "cc-pvdz"
density_fit = true
conv_tol = 1e-10
max_cycle = 100
memory_mb = 2000
threads = 2
pyscf_verbose = 2

[scan]
type = "angle"
reference = "water.xyz"
atoms = [2, 1, 3]
move_atoms = [3]
minimum = 90.0
maximum = 180.0
points = 7

[tracking]
orbitals_each_side = 1
candidate_margin = 2
max_energy_step_ev = 5.0

[output]
directory = "run_water_mp2"
coordinate_label = "H-O-H angle (degrees)"
title = "H2O Walsh diagram (MP2/cc-pVDZ energy; HF orbitals)"
energy_reference = "minimum"
