[system]
name = "My molecule"
charge = 0
spin = 0

[method]
theory = "dft"
xc = "b3lyp"
dispersion = "d3bj"
basis = "def2-tzvp"
# For heavy atoms, specify matching scalar ECPs, for example:
# ecp = { Mo = "def2-tzvp" }
density_fit = true
grid_level = 4
conv_tol = 1e-9
max_cycle = 150
memory_mb = 30000
threads = 8

[scan]
type = "normal_mode"
reference = "reference.xyz"
mode_index = 0  # 0 = lowest signed frequency, normally most imaginary
minimum = -0.75
maximum = 0.75
points = 21

[tracking]
orbitals_each_side = 2
candidate_margin = 5
max_energy_step_ev = 1.0
reference_index = 10

[output]
directory = "run_normal_mode"
coordinate_label = "Normalized Cartesian-mode displacement (Angstrom)"
energy_reference = "reference"
