[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walshflow"
version = "0.2.0"
description = "Restartable PySCF workflow for identity-tracked Walsh diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyscf>=2.8",
]

[project.optional-dependencies]
dispersion = ["dftd3>=1.3"]
test = ["pytest>=8"]

[project.scripts]
walshflow = "walshflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["walshflow*"]
